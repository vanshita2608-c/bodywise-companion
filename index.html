<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is It Working? — Bodywise Companion</title>
<meta name="description" content="A results companion for Be Bodywise customers: use it right, know what to expect, and see whether it's actually working.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F3; --surface:#FFFFFF; --surface-2:#F4EDE6; --ink:#2A1F1D; --ink-2:#6B5B56; --line:#E8DDD4;
  --brand:#B4536A; --brand-ink:#FFFFFF; --brand-soft:#F6E3E7;
  --good:#2F7D5B; --good-soft:#E2F2EA; --warn:#A8621B; --warn-soft:#FBEBD8; --bad:#B23B3B; --bad-soft:#F8E1E1;
  --band:#E9D7DC; --shadow:0 1px 2px rgba(42,31,29,.06),0 6px 24px rgba(42,31,29,.06);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17120F; --surface:#221B18; --surface-2:#2C2420; --ink:#F3EAE4; --ink-2:#B9A9A2; --line:#3A302B;
    --brand:#E08AA0; --brand-ink:#1E1412; --brand-soft:#3A2329;
    --good:#6CC79C; --good-soft:#1E3329; --warn:#E3A35E; --warn-soft:#3A2A18; --bad:#EC8A8A; --bad-soft:#3A1F1F;
    --band:#4A2E35; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#17120F; --surface:#221B18; --surface-2:#2C2420; --ink:#F3EAE4; --ink-2:#B9A9A2; --line:#3A302B;
  --brand:#E08AA0; --brand-ink:#1E1412; --brand-soft:#3A2329;
  --good:#6CC79C; --good-soft:#1E3329; --warn:#E3A35E; --warn-soft:#3A2A18; --bad:#EC8A8A; --bad-soft:#3A1F1F;
  --band:#4A2E35; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:34px;line-height:1.12}
h2{font-size:22px;line-height:1.25}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:12px}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:20px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 16px}
.logo{font-family:Fraunces,serif;font-weight:600;font-size:17px;display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 20px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--brand);color:var(--brand-ink);width:100%;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--ink-2);font:500 13px Inter,sans-serif;cursor:pointer;text-decoration:underline;padding:6px}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:500;color:var(--ink-2)}
.hero{padding:20px 0 8px}
.hero h1 em{font-style:normal;color:var(--brand)}
.quote{border-left:3px solid var(--brand);padding:2px 0 2px 12px;font-size:14px;color:var(--ink-2);font-style:italic}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.pillar b{display:block;font-size:20px;margin-bottom:2px}
.pillar span{font-size:12px;color:var(--ink-2);line-height:1.3;display:block}
.plist{display:grid;gap:10px}
.pcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;color:var(--ink);font:inherit}
.pcard:hover{border-color:var(--brand)}
.pcard.sel{border-color:var(--brand);background:var(--brand-soft)}
.picon{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;flex:none}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.progress{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);transition:width .3s}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font:600 12px Inter;display:grid;place-items:center;margin-top:1px}
.steps li.key{font-weight:600}
.steps li.key::after{content:"key step";margin-left:auto;flex:none;font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:999px;height:fit-content}
.tl{position:relative;padding-left:22px;display:grid;gap:14px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.tl>div.now::before{background:var(--brand)}
.tl b{font-size:13px;color:var(--brand)}
.callout{border-radius:12px;padding:12px 14px;font-size:14px}
.callout.warn{background:var(--warn-soft);color:var(--ink)}
.callout.info{background:var(--surface-2)}
.verdict{border-radius:var(--r);padding:18px;border:1px solid transparent}
.verdict.good{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 25%,transparent)}
.verdict.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.verdict.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.verdict.neutral{background:var(--surface-2)}
.vlabel{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.verdict.good .vlabel{color:var(--good)} .verdict.warn .vlabel{color:var(--warn)} .verdict.bad .vlabel{color:var(--bad)} .verdict.neutral .vlabel{color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-family:Fraunces,serif}
.stat span{font-size:12px;color:var(--ink-2)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font:600 14px Inter;color:var(--ink);cursor:pointer}
.scale button.sel{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.scale-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:4px}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tg{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:500 13px Inter;color:var(--ink);cursor:pointer}
.tg.sel{border-color:var(--brand);background:var(--brand-soft)}
.week-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{aspect-ratio:1;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--ink-2);border:1.5px solid transparent}
.wd.done{background:var(--good-soft);color:var(--good);font-weight:600}
.wd.miss{background:var(--bad-soft);color:var(--bad)}
.wd.today{border-color:var(--brand)}
.row{display:flex;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.tabs .in{max-width:560px;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{background:none;border:0;padding:12px 0 14px;font:500 12px Inter;color:var(--ink-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{color:var(--brand);font-weight:600}
.tabs svg{width:22px;height:22px}
.banner{background:var(--brand-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.foot{margin-top:28px;font-size:12px;color:var(--ink-2);text-align:center;line-height:1.5}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px 28px}
.marker-row+.marker-row{margin-top:16px}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs hidden" id="tabs"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>Today</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Is it working?</button>
  <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h6"/></svg>How to use</button>
</div></nav>

<script>
/* ---------------------------------------------------------------
   Product knowledge. Usage + timelines are general guidance for each
   active ingredient; the app always tells people to follow the pack.
---------------------------------------------------------------- */
const PRODUCTS = {
  sa_wash: {
    name: "1% Salicylic Acid Body Wash", short: "SA Body Wash", icon: "🧴", cat: "Body care",
    concerns: ["Strawberry legs / bumpy skin (KP)", "Body or back acne", "Rough, uneven texture"],
    markers: [
      { id: "bumps", label: "Bumps / rough texture", primary: true },
      { id: "breakouts", label: "Breakouts", primary: true },
      { id: "dryness", label: "Dryness or irritation", primary: false }
    ],
    keyStep: "Left it on for ~1 minute before rinsing",
    steps: [
      "Wet your skin in the shower.",
      "Apply to the problem areas and gently massage into a lather.",
      { t: "Leave it on for about a minute before rinsing; the acid needs contact time to work.", key: true },
      "Rinse with lukewarm (not hot) water.",
      "Moisturise while skin is still slightly damp."
    ],
    mistake: "Using it like a regular body wash and rinsing it off straight away. The salicylic acid barely gets time on the skin.",
    timeline: [
      { w: 1, t: "Skin starts to feel a little smoother to touch." },
      { w: 3, t: "Fewer new bumps and breakouts; texture looks more even." },
      { w: 6, t: "Clearer, smoother skin for most mild-to-moderate cases." },
      { w: 8, t: "Fair point to judge it. Long-standing bumps (KP) improve but need ongoing use. It's managed, not 'cured'." }
    ],
    judgeWeek: 8, earlyWeek: 2, typical: 0.5, lastsDays: 45,
    watch: "Tightness or dryness? Use it every other day and moisturise. Stinging or redness that doesn't settle: stop and check with a dermatologist."
  },
  zpto: {
    name: "1% ZPTO Anti-Dandruff Shampoo", short: "ZPTO Shampoo", icon: "🫧", cat: "Hair care",
    concerns: ["Dandruff / flakes", "Itchy scalp", "Oily, build-up scalp"],
    markers: [
      { id: "itch", label: "Scalp itch", primary: true },
      { id: "flakes", label: "Visible flakes", primary: true },
      { id: "dry", label: "Hair feels dry / thin", primary: false }
    ],
    keyStep: "Left it on the scalp for 2–3 minutes",
    steps: [
      "Wet hair and scalp thoroughly.",
      "Apply to the scalp (not the lengths) and massage with fingertips.",
      { t: "Leave on the scalp for 2–3 minutes so the actives can work, then rinse.", key: true },
      "Use conditioner on the lengths only, to keep hair soft.",
      "Use 2–3 times a week; drop to 1–2 once flakes are under control."
    ],
    mistake: "Washing it straight out like normal shampoo, or skipping conditioner and blaming the shampoo when lengths feel dry.",
    timeline: [
      { w: 1, t: "Itching usually eases first." },
      { w: 2, t: "Visibly fewer flakes; scalp feels cleaner." },
      { w: 4, t: "Fair point to judge it. Most people see clear control of flakes and itch." },
      { w: 6, t: "Maintenance mode: fewer washes a week keeps it in check." }
    ],
    judgeWeek: 4, earlyWeek: 1, typical: 0.55, lastsDays: 40,
    watch: "Lengths feel dry or thin? Keep the shampoo on the scalp and use conditioner on the ends."
  },
  rollon: {
    name: "Underarm Roll-On", short: "Roll-On", icon: "🌿", cat: "Body care",
    concerns: ["Underarm odour", "Heavy sweating", "Gym / active lifestyle"],
    markers: [
      { id: "odour", label: "Odour by evening", primary: true },
      { id: "sweat", label: "Sweaty feeling", primary: true },
      { id: "irritation", label: "Irritation or wetness on clothes", primary: false }
    ],
    keyStep: "Let it dry fully before dressing",
    steps: [
      "Apply at night on clean, completely dry underarms.",
      "1–2 swipes is enough; more doesn't work better.",
      { t: "Let it dry fully (about 5–6 minutes) before putting on clothes.", key: true },
      "Close the cap tightly and keep it upright in your bag when travelling.",
      "Shower as normal in the morning; protection keeps working."
    ],
    mistake: "Putting clothes on while it's still wet, and expecting it to work like a spray deodorant applied in the morning.",
    timeline: [
      { w: 1, t: "Noticeable odour control through the day." },
      { w: 2, t: "Fair point to judge it. Consistent freshness and less sweat." },
      { w: 4, t: "Steady routine; one bottle typically lasts about 5 weeks." }
    ],
    judgeWeek: 2, earlyWeek: 1, typical: 0.6, lastsDays: 35,
    watch: "Itching or stinging? Don't apply right after shaving or on broken skin."
  },
  biotin: {
    name: "Hair Health Biotin Gummies", short: "Biotin Gummies", icon: "🍓", cat: "Nutrition",
    concerns: ["Hair fall / thinning", "Weak, brittle nails", "General hair health"],
    markers: [
      { id: "hairfall", label: "Hair fall (shedding)", primary: true },
      { id: "nails", label: "Weak / breaking nails", primary: true },
      { id: "pimples", label: "Breakouts", primary: false }
    ],
    keyStep: "Took today's dose",
    steps: [
      "Take the dose on the label, at the same time every day (pair it with breakfast).",
      { t: "Consistency matters more than anything; missed days delay results.", key: true },
      "Store in a cool, dry place; heat makes gummies stick to each other and the wrapper.",
      "Log any other hair changes (new shampoo, oil, diet) so you know what's actually working."
    ],
    mistake: "Changing shampoo or routine at the same time, then not knowing which one made the difference.",
    timeline: [
      { w: 3, t: "Nails often feel stronger first." },
      { w: 6, t: "Shedding may start to slow." },
      { w: 12, t: "Fair point to judge it for hair. Hair grows slowly, so 3 months is the honest window." }
    ],
    judgeWeek: 12, earlyWeek: 4, typical: 0.4, lastsDays: 30,
    watch: "A few small pimples in the first weeks can happen with biotin and usually settle. If they persist, check with a doctor."
  }
};

const SCALE = ["None", "Mild", "Noticeable", "Bad", "Severe"];
const CHANGES = ["New hair/skin product", "Stopped using it for days", "Diet change", "Stress / poor sleep", "Weather / travel", "Periods / hormones"];
const KEY = "bw_companion_v1";
const DAY = 86400000;

/* ---------- state ---------- */
let S = load();
let tab = "today";
let onb = { step: 0, product: null, concern: null, duration: null, baseline: {} };

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function dkey(d){ const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x.getTime(); }
function daysSince(){ return Math.floor((startOfDay(Date.now()) - startOfDay(S.start)) / DAY); }
function weekNo(){ return Math.floor(daysSince() / 7); }   // completed weeks
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const P = () => PRODUCTS[S.product];

/* ---------- maths ---------- */
function primaryAvg(scores, prod){
  const ms = prod.markers.filter(m => m.primary);
  return ms.reduce((a,m) => a + (scores[m.id] ?? 0), 0) / ms.length;
}
function improvement(scores){            // 0..1 vs baseline
  const b = primaryAvg(S.baseline, P());
  if (b === 0) return 0;
  return Math.max(-1, (b - primaryAvg(scores, P())) / b);
}
function expectedAt(w, prod){            // typical improvement fraction at week w
  const f = Math.min(1, w / prod.judgeWeek);
  return prod.typical * Math.pow(f, 0.8);
}
function adherence(days){                // share of last N days used
  const n = Math.min(days, daysSince() + 1);
  if (n <= 0) return null;
  let used = 0;
  for (let i = 0; i < n; i++){ const k = dkey(Date.now() - i*DAY); if (S.logs[k]?.used) used++; }
  return used / n;
}
function keyStepRate(){
  const ks = Object.values(S.logs).filter(l => l.used);
  if (!ks.length) return null;
  return ks.filter(l => l.key).length / ks.length;
}

function verdict(){
  const prod = P(), w = weekNo();
  const last = S.weekly[S.weekly.length - 1];
  const adh = adherence(14), ks = keyStepRate();
  const recentChanges = S.weekly.slice(-2).flatMap(x => x.changes || []);
  if (!last || w < prod.earlyWeek){
    const next = prod.timeline.find(t => t.w > w) || prod.timeline[prod.timeline.length-1];
    return { tone: "neutral", label: "Too early to judge", title: "Give it time. You're right where you should be.",
      body: `Most people only start noticing a change from ${esc(prod.short)} around week ${prod.earlyWeek}. Next up, <b>week ${next.w}</b>: ${esc(next.t)} Keep using it daily and do your weekly check-in.` };
  }
  const imp = improvement(last.scores), exp = expectedAt(w, prod);
  const pct = Math.round(imp*100);
  if (adh !== null && adh < 0.6){
    return { tone: "warn", label: "Not enough data yet", title: "Results depend on consistency.",
      body: `You used it on ${Math.round(adh*100)}% of the last 14 days. Skipped days slow down results, so it's not a fair test yet. Aim for at least 5 days a week before judging.` };
  }
  if (recentChanges.length && imp > 0){
    return { tone: "warn", label: "Improving, but there's a mix-up", title: `${pct}% better, but something else changed too.`,
      body: `You also logged: <b>${esc([...new Set(recentChanges)].join(", "))}</b>. Keep everything else steady for 2 weeks so you know what's actually helping.` };
  }
  if (imp >= exp * 0.6){
    return { tone: "good", label: "It's working", title: `${pct}% better than when you started.`,
      body: `${imp > exp*1.4 ? "That's ahead of" : "That's in"} the typical range for week ${w}. Keep the routine going. ${w < prod.judgeWeek ? "The full picture comes at week " + prod.judgeWeek + "." : "You've passed the full trial window, so this is real progress."}` };
  }
  if (w < prod.judgeWeek){
    const tip = ks !== null && ks < 0.7
      ? `You did the key step (<i>${esc(prod.keyStep.toLowerCase())}</i>) only ${Math.round(ks*100)}% of the time. That's the most common reason results are slow.`
      : `Check the key step: <i>${esc(prod.keyStep.toLowerCase())}</i>. It makes the biggest difference.`;
    return { tone: "warn", label: "Slower than typical", title: `${Math.max(pct,0)}% better so far. Don't give up yet.`,
      body: `${tip} You still have ${prod.judgeWeek - w} week(s) before it's fair to judge.` };
  }
  return { tone: "bad", label: "Full trial done, not enough change", title: "It may not be the right fit for you.",
    body: `You've used it consistently for ${w} weeks with only ${Math.max(pct,0)}% improvement. Long-standing concerns can need a different strength or a doctor's input. A short consult with a dermatologist or a product switch is a better next step than continuing as is.` };
}

/* ---------- render ---------- */
const app = document.getElementById("app");
const tabsEl = document.getElementById("tabs");

function render(){
  if (!S){ tabsEl.classList.add("hidden"); return onb.step === 0 ? renderLanding() : renderOnboarding(); }
  tabsEl.classList.remove("hidden");
  tabsEl.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({ today: renderToday, progress: renderProgress, guide: renderGuide })[tab]();
}
let lastScreen = "";
function go(){ const scr = (S ? "app:"+tab : "onb:"+onb.step); render(); if (scr !== lastScreen){ window.scrollTo(0,0); lastScreen = scr; } }

function header(){
  return `<div class="top"><div class="logo"><span class="dot"></span>Is It Working?</div>
    ${S ? `<button class="link" data-act="reset">Start over</button>` : `<span class="chip">for Be Bodywise</span>`}</div>`;
}

function renderLanding(){
  app.innerHTML = `${header()}
  <div class="stack-lg">
    <div class="hero stack">
      <h1>Know if your product is <em>actually working</em>.</h1>
      <p class="muted">Use it the right way, know what to expect each week, and get an honest answer from your own progress, not guesswork.</p>
    </div>
    <div class="pillars">
      <div class="pillar"><b>①</b><span>Use it right: the step most people skip</span></div>
      <div class="pillar"><b>②</b><span>Know what to expect, week by week</span></div>
      <div class="pillar"><b>③</b><span>See if it's working, with a 30-sec check-in</span></div>
    </div>
    <div class="stack">
      <button class="btn" data-act="begin">Start my tracker</button>
      <button class="btn ghost" data-act="demo">See a 5-week example</button>
    </div>
    <div class="card stack">
      <p class="small muted">Why this exists. Real Be Bodywise customers told us:</p>
      <p class="quote">"Mujhe itna difference nahi dikha jitna main expect kar rahi thi… I'll switch to another one."</p>
      <p class="quote">"I don't know about the hairfall… uss hi time maine shampoo bhi change kiya tha, so I don't know kisne kaam kiya."</p>
      <p class="quote">"Bottle pe thoda clearer usage instructions."</p>
    </div>
    <p class="foot">Concept prototype built for the Mosaic Fellowship Builder Challenge.<br>Not an official Be Bodywise app. Your data stays on this device.</p>
  </div>`;
}

function renderOnboarding(){
  const total = 4, s = onb.step;
  let body = "";
  if (s === 1){
    body = `<h2>Which product are you using?</h2>
    <div class="plist">${Object.entries(PRODUCTS).map(([id,p]) => `
      <button class="pcard ${onb.product===id?"sel":""}" data-pick="${id}">
        <span class="picon">${p.icon}</span><span><b>${esc(p.name)}</b><br><span class="small muted">${esc(p.cat)}</span></span>
      </button>`).join("")}</div>`;
  } else if (s === 2){
    const p = PRODUCTS[onb.product];
    body = `<h2>What are you using it for?</h2>
    <div class="opts">${p.concerns.map(c => `<button class="opt ${onb.concern===c?"sel":""}" data-concern="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <h3 style="margin-top:22px">How long have you had this concern?</h3>
    <p class="small muted">Long-standing concerns usually take longer to respond. We'll set expectations accordingly.</p>
    <div class="opts">${["Less than 3 months","3–12 months","More than a year"].map(d => `<button class="opt ${onb.duration===d?"sel":""}" data-duration="${d}">${d}</button>`).join("")}</div>`;
  } else if (s === 3){
    const p = PRODUCTS[onb.product];
    body = `<h2>Where are you starting from?</h2>
    <p class="muted small">Rate how things are <b>today</b>. This is your baseline; every week we'll compare against it. Without it, it's impossible to tell if anything changed.</p>
    <div class="card">${p.markers.map(m => scaleRow(m, onb.baseline[m.id], "base")).join("")}</div>`;
  } else if (s === 4){
    const p = PRODUCTS[onb.product];
    body = `<h2>Your plan for ${esc(p.short)}</h2>
    ${onb.duration==="More than a year" ? `<div class="callout warn">You've had this for over a year, so expect results toward the later end of these timelines. That's normal, not failure.</div>` : ""}
    <div class="card stack"><h3>What to expect</h3>${timelineHTML(p, -1)}</div>
    <div class="card stack"><h3>The step most people skip</h3><p>${esc(p.steps.find(x=>x.key).t)}</p>
    <div class="callout info small"><b>Common mistake:</b> ${esc(p.mistake)}</div></div>`;
  }
  const canNext = (s===1 && onb.product) || (s===2 && onb.concern && onb.duration) ||
    (s===3 && PRODUCTS[onb.product].markers.every(m => onb.baseline[m.id] !== undefined)) || s===4;
  app.innerHTML = `${header()}
    <div class="stack-lg">
      <div class="row between"><button class="link" data-act="back">← Back</button><span class="small muted">Step ${s} of ${total}</span></div>
      <div class="progress"><i style="width:${s/total*100}%"></i></div>
      ${body}
      <button class="btn" data-act="next" ${canNext?"":"disabled"}>${s===4?"Start tracking":"Continue"}</button>
    </div>`;
}

function scaleRow(m, val, ns, base){
  return `<div class="marker-row"><p class="small" style="margin-bottom:6px"><b>${esc(m.label)}</b></p>
    <div class="scale">${SCALE.map((_,i) => `<button class="${val===i?"sel":""}" data-${ns}="${m.id}" data-v="${i}" aria-label="${esc(m.label)}: ${SCALE[i]}">${i}${base===i?" ●":""}</button>`).join("")}</div>
    <div class="scale-lbl"><span>None</span><span>Severe</span></div></div>`;
}

function timelineHTML(p, w){
  return `<div class="tl">${p.timeline.map(t => `<div class="${w>=0 && w>=t.w-1 && w<t.w+1?"now":""}"><b>Week ${t.w}${t.w===p.judgeWeek?" · judge here":""}</b><p class="small">${esc(t.t)}</p></div>`).join("")}</div>`;
}

function renderToday(){
  const p = P(), d = daysSince(), w = weekNo(), today = dkey(Date.now());
  const log = S.logs[today] || {};
  const lastW = S.weekly[S.weekly.length-1];
  const checkinDue = !lastW || lastW.week < w;
  const usedDays = Object.values(S.logs).filter(l=>l.used).length;
  const daysLeft = p.lastsDays - (usedDays % p.lastsDays);
  const v = verdict();
  const dots = Array.from({length:7}, (_,i) => {
    const t = Date.now() - (6-i)*DAY, k = dkey(t), before = startOfDay(t) < startOfDay(S.start);
    const cls = before ? "" : S.logs[k]?.used ? "done" : (k===today ? "" : "miss");
    return `<div class="wd ${cls} ${k===today?"today":""}">${"SMTWTFS"[new Date(t).getDay()]}</div>`;
  }).join("");
  app.innerHTML = `${header()}
  <div class="stack-lg">
    ${S.demo ? `<div class="banner"><span>You're viewing a sample 5-week journey.</span><button class="btn small" data-act="reset">Start my own</button></div>` : ""}
    <div class="stack">
      <span class="chip">${p.icon} ${esc(p.short)} · Day ${d+1} · Week ${w+1}</span>
      <h2>Today</h2>
    </div>
    <div class="card stack">
      <div class="row between"><h3>Did you use it today?</h3>${log.used?`<span class="chip" style="background:var(--good-soft);color:var(--good)">Done ✓</span>`:""}</div>
      <div class="toggles">
        <button class="tg ${log.used?"sel":""}" data-act="used">Yes, used it</button>
        <button class="tg ${log.used && log.key?"sel":""}" data-act="key" ${log.used?"":"disabled"}>${esc(p.keyStep)}</button>
      </div>
      <div class="week-dots">${dots}</div>
    </div>
    ${checkinDue && d >= 6 ? `<div class="card stack" style="border-color:var(--brand)"><h3>Your weekly check-in is ready</h3><p class="small muted">30 seconds. Rate how things look this week, and we'll tell you if you're on track.</p><button class="btn" data-act="checkin">Do week ${w} check-in</button></div>` : ""}
    <div class="verdict ${v.tone} stack"><span class="vlabel">${v.label}</span><h3>${v.title}</h3><p class="small">${v.body}</p>
      <button class="link" style="padding-left:0" data-tab-go="progress">See full progress →</button></div>
    <div class="card stack"><h3>This stage</h3>${timelineHTML(p, w)}</div>
    <div class="callout info small">🧴 About <b>${daysLeft} days</b> of product left at your pace.${daysLeft<=7?" Time to reorder so you don't break the routine.":""}</div>
    ${!checkinDue || d < 6 ? `<button class="btn ghost" data-act="checkin">Log a check-in now</button>` : ""}
  </div>`;
}

function renderProgress(){
  const p = P(), w = weekNo(), v = verdict();
  const last = S.weekly[S.weekly.length-1];
  const imp = last ? Math.round(improvement(last.scores)*100) : 0;
  const adh = adherence(14), ks = keyStepRate();
  app.innerHTML = `${header()}
  <div class="stack-lg">
    <div class="stack"><span class="chip">${p.icon} ${esc(p.short)}</span><h2>Is it working?</h2></div>
    <div class="verdict ${v.tone} stack"><span class="vlabel">${v.label}</span><h3>${v.title}</h3><p class="small">${v.body}</p></div>
    <div class="stats">
      <div class="stat"><b>${last?imp+"%":"–"}</b><span>better vs start</span></div>
      <div class="stat"><b>${adh===null?"–":Math.round(adh*100)+"%"}</b><span>days used (14d)</span></div>
      <div class="stat"><b>${ks===null?"–":Math.round(ks*100)+"%"}</b><span>key step done</span></div>
    </div>
    <div class="card stack chart">
      <h3>Your progress vs. typical</h3>
      ${chartSVG()}
      <div class="legend"><span><i style="background:var(--brand)"></i>You</span><span><i style="background:var(--band)"></i>Typical range</span><span><i style="background:var(--warn);border-radius:50%"></i>Something else changed</span></div>
      <p class="tiny muted">Improvement in your main concerns compared with your week-0 baseline. Dashed line = week ${p.judgeWeek}, the fair point to judge.</p>
    </div>
    <div class="card stack"><h3>By concern</h3>${markerBars()}</div>
    ${S.weekly.length ? `<div class="card stack"><h3>Check-in history</h3>${S.weekly.slice().reverse().map(x => `
      <div class="row between small"><span>Week ${x.week}</span><span class="muted">${Math.round(improvement(x.scores)*100)}% better${x.changes?.length?` · ⚠ ${esc(x.changes.join(", "))}`:""}</span></div>`).join("")}</div>` : ""}
    <button class="btn ghost" data-act="checkin">Log a check-in</button>
  </div>`;
}

function chartSVG(){
  const p = P(), W = 320, H = 180, padL = 34, padR = 10, padT = 10, padB = 26;
  const maxW = Math.max(p.judgeWeek, weekNo(), ...S.weekly.map(x=>x.week), 2);
  const x = wk => padL + (wk/maxW)*(W-padL-padR);
  const y = v => padT + (1 - (v+0.2)/1.2)*(H-padT-padB);   // range -20%..100%
  let band = "";
  const pts = []; for (let i=0;i<=maxW;i+=maxW/24) pts.push(i);
  band = `M${pts.map(i=>`${x(i)},${y(expectedAt(i,p)*1.4>1?1:expectedAt(i,p)*1.4)}`).join(" L")} L${pts.slice().reverse().map(i=>`${x(i)},${y(expectedAt(i,p)*0.6)}`).join(" L")} Z`;
  const series = [{week:0, v:0}, ...S.weekly.map(z => ({week:z.week, v:improvement(z.scores), ch:z.changes?.length}))];
  const line = series.map((s,i)=>`${i?"L":"M"}${x(s.week)},${y(s.v)}`).join(" ");
  const grid = [0,0.25,0.5,0.75,1].map(g=>`<line x1="${padL}" x2="${W-padR}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${y(g)+4}" text-anchor="end" font-size="10" fill="var(--ink-2)">${g*100}%</text>`).join("");
  const xt = []; const step = maxW>8?2:1; for (let i=0;i<=maxW;i+=step) xt.push(`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-2)">W${i}</text>`);
  const dots = series.map(s=>`<circle cx="${x(s.week)}" cy="${y(s.v)}" r="${s.ch?5:3.5}" fill="${s.ch?"var(--warn)":"var(--brand)"}" stroke="var(--surface)" stroke-width="1.5"><title>Week ${s.week}: ${Math.round(s.v*100)}%</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Improvement over weeks compared with typical range">
    ${grid}<path d="${band}" fill="var(--band)" opacity=".8"/>
    <line x1="${x(p.judgeWeek)}" x2="${x(p.judgeWeek)}" y1="${padT}" y2="${H-padB}" stroke="var(--ink-2)" stroke-dasharray="3 3"/>
    <path d="${line}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xt.join("")}</svg>`;
}

function markerBars(){
  const p = P(), last = S.weekly[S.weekly.length-1];
  return p.markers.map(m => {
    const b = S.baseline[m.id] ?? 0, n = last ? (last.scores[m.id] ?? b) : b;
    const better = n < b, worse = n > b;
    return `<div><div class="row between small"><span>${esc(m.label)}</span><span class="muted">${SCALE[b]} → <b style="color:${better?"var(--good)":worse?"var(--bad)":"var(--ink)"}">${SCALE[n]}</b></span></div>
      <div class="progress" style="height:6px;margin-top:6px"><i style="width:${n/4*100}%;background:${better?"var(--good)":worse?"var(--bad)":"var(--ink-2)"}"></i></div></div>`;
  }).join("");
}

function renderGuide(){
  const p = P();
  app.innerHTML = `${header()}
  <div class="stack-lg">
    <div class="stack"><span class="chip">${p.icon} ${esc(p.short)}</span><h2>How to use it right</h2></div>
    <div class="card stack"><ol class="steps">${p.steps.map(s => typeof s==="string" ? `<li>${esc(s)}</li>` : `<li class="key">${esc(s.t)}</li>`).join("")}</ol></div>
    <div class="callout warn small"><b>Most common mistake:</b> ${esc(p.mistake)}</div>
    <div class="card stack"><h3>What to expect, week by week</h3>${timelineHTML(p, weekNo())}</div>
    <div class="card stack"><h3>Watch out for</h3><p class="small">${esc(p.watch)}</p></div>
    <p class="tiny muted">General guidance for this type of product. Always follow the instructions on your pack, and see a doctor for anything that worries you.</p>
  </div>`;
}

/* ---------- check-in sheet ---------- */
let ci = null;
function openCheckin(){
  const last = S.weekly[S.weekly.length-1];
  ci = { scores: {...(last?.scores || S.baseline)}, changes: [] };
  drawSheet();
}
function drawSheet(){
  const p = P(), w = Math.max(1, weekNo());
  document.getElementById("sheet")?.remove();
  const el = document.createElement("div");
  el.className = "sheet-bg"; el.id = "sheet";
  el.innerHTML = `<div class="sheet stack-lg" role="dialog" aria-label="Weekly check-in">
    <div class="row between"><h2>Week ${w} check-in</h2><button class="link" data-act="close">Close</button></div>
    <p class="small muted">How do things look <b>this week</b>? Compare honestly with your start. Your baseline is marked ●.</p>
    <div class="card">${p.markers.map(m => scaleRow(m, ci.scores[m.id], "ci", S.baseline[m.id])).join("")}</div>
    <div class="stack"><h3>Did anything else change this week?</h3>
      <p class="small muted">This helps us tell what's really causing a change.</p>
      <div class="toggles">${CHANGES.map(c => `<button class="tg ${ci.changes.includes(c)?"sel":""}" data-chg="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>
    <button class="btn" data-act="saveci">Save check-in</button>
  </div>`;
  document.body.appendChild(el);
}

/* ---------- demo data ---------- */
function makeDemo(){
  const start = Date.now() - 36*DAY;
  const s = { product: "biotin", concern: "Hair fall / thinning", duration: "3–12 months", start, demo: true,
    baseline: { hairfall: 3, nails: 3, pimples: 0 }, logs: {}, weekly: [] };
  for (let i = 0; i <= 36; i++){
    const t = start + i*DAY, skip = (i % 9 === 4) || i === 18;
    if (!skip) s.logs[dkey(t)] = { used: true, key: true };
  }
  s.weekly = [
    { week: 1, scores: { hairfall: 3, nails: 3, pimples: 1 }, changes: [] },
    { week: 2, scores: { hairfall: 3, nails: 2, pimples: 1 }, changes: [] },
    { week: 3, scores: { hairfall: 2, nails: 2, pimples: 0 }, changes: ["New hair/skin product"] },
    { week: 4, scores: { hairfall: 2, nails: 1, pimples: 0 }, changes: [] },
    { week: 5, scores: { hairfall: 2, nails: 1, pimples: 0 }, changes: [] }
  ];
  return s;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.tab){ tab = d.tab; return go(); }
  if (d.tabGo){ tab = d.tabGo; return go(); }
  if (d.pick){ onb.product = d.pick; onb.baseline = {}; return go(); }
  if (d.concern){ onb.concern = d.concern; return go(); }
  if (d.duration){ onb.duration = d.duration; return go(); }
  if (d.base){ onb.baseline[d.base] = +d.v; return go(); }
  if (d.ci){ ci.scores[d.ci] = +d.v; return drawSheet(); }
  if (d.chg){ ci.changes = ci.changes.includes(d.chg) ? ci.changes.filter(x=>x!==d.chg) : [...ci.changes, d.chg]; return drawSheet(); }
  const today = dkey(Date.now());
  switch (d.act){
    case "begin": onb = { step: 1, product: null, concern: null, duration: null, baseline: {} }; return go();
    case "demo": S = makeDemo(); tab = "today"; save(); return go();
    case "back": onb.step = Math.max(0, onb.step-1); return go();
    case "next":
      if (onb.step < 4){ onb.step++; return go(); }
      S = { product: onb.product, concern: onb.concern, duration: onb.duration, start: Date.now(), baseline: {...onb.baseline}, logs: {}, weekly: [] };
      tab = "today"; save(); return go();
    case "reset":
      if (S && !S.demo && !confirm("Start over? This clears your tracking on this device.")) return;
      S = null; onb = { step: 0, product: null, concern: null, duration: null, baseline: {} };
      try { localStorage.removeItem(KEY); } catch(e){}
      return go();
    case "used": { const l = S.logs[today] || {}; S.logs[today] = l.used ? {} : { used: true, key: false }; save(); return go(); }
    case "key": { const l = S.logs[today]; if (l?.used){ l.key = !l.key; save(); } return go(); }
    case "checkin": return openCheckin();
    case "close": document.getElementById("sheet")?.remove(); return;
    case "saveci": {
      const w = Math.max(1, weekNo());
      S.weekly = S.weekly.filter(x => x.week !== w).concat([{ week: w, scores: {...ci.scores}, changes: [...ci.changes] }]).sort((a,b)=>a.week-b.week);
      save(); document.getElementById("sheet")?.remove(); tab = "progress"; return go();
    }
  }
});
document.addEventListener("click", e => { if (e.target.id === "sheet") e.target.remove(); });

go();
</script>
</body>
